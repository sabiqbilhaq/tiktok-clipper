<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Clipper Ceramah AI</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1324; color: #f1f5f9; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 820px; }
    h1 { color: #1da1f2; margin: 0 0 6px; font-size: 28px; }
    .subtitle { color: #94a3b8; margin: 0 0 24px; font-size: 14px; }
    .card { background: #162033; border: 1px solid #26354d; border-radius: 12px; padding: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 11px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #f8fafc; font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: #1da1f2; }
    .full { margin-bottom: 16px; }
    button {
      width: 100%; padding: 13px; border: none; border-radius: 8px;
      background: #0ea5e9; color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #0284c7; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 14px; border-radius: 8px; display: none; font-size: 14px; }
    .status.loading { display: block; background: #1e293b; border: 1px solid #38bdf8; color: #bae6fd; }
    .status.error { display: block; background: #7f1d1d; border: 1px solid #ef4444; color: #fecaca; }
    .clips { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .clip-card { background: #162033; border: 1px solid #26354d; border-radius: 10px; padding: 14px; }
    .clip-card h3 { margin: 0 0 6px; font-size: 15px; color: #38bdf8; }
    .clip-card p { margin: 0 0 10px; font-size: 12px; color: #94a3b8; }
    video { width: 100%; border-radius: 8px; background: #000; margin-bottom: 10px; }
    .dl-btn {
      display: block; text-align: center; background: #10b981; color: #fff;
      text-decoration: none; padding: 9px; border-radius: 6px; font-weight: 600; font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Auto Clipper Ceramah AI</h1>
    <p class="subtitle">Paste link YouTube ceramah -&gt; AI pilih momen terbaik -&gt; Potong 9:16 + Subtitle Otomatis</p>

    <div class="card">
      <div class="grid">
        <div>
          <label for="yt_url">Link Video YouTube Ceramah</label>
          <input type="text" id="yt_url" placeholder="[https://www.youtube.com/watch?v=](https://www.youtube.com/watch?v=)..." />
        </div>
        <div>
          <label for="num_clips">Jumlah Klip Otomatis</label>
          <select id="num_clips">
            <option value="2">2 Klip Terbaik</option>
            <option value="3" selected>3 Klip Terbaik</option>
            <option value="4">4 Klip Terbaik</option>
          </select>
        </div>
      </div>

      {% if not has_server_keys %}
      <div class="grid">
        <div>
          <label for="groq_key">Groq API Key</label>
          <input type="password" id="groq_key" placeholder="gsk_..." />
        </div>
        <div>
          <label for="gemini_key">Gemini API Key</label>
          <input type="password" id="gemini_key" placeholder="AIza..." />
        </div>
      </div>
      {% endif %}

      <div class="full">
        <label for="password">Password Akses (Jika diatur di server)</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="Masukkan password akses..." />
      </div>

      <button id="submit_btn" onclick="generateClips()">Buat Klip TikTok Sekarang</button>
    </div>

    <div id="status_box" class="status"></div>
    <div id="clips_container" class="clips"></div>
  </div>

  <script>
    async function generateClips() {
      const url = document.getElementById("yt_url").value.trim();
      const numClips = document.getElementById("num_clips").value;
      const password = document.getElementById("password").value.trim();
      const groqEl = document.getElementById("groq_key");
      const geminiEl = document.getElementById("gemini_key");

      const statusBox = document.getElementById("status_box");
      const clipsContainer = document.getElementById("clips_container");
      const btn = document.getElementById("submit_btn");

      if (!url) {
        statusBox.className = "status error";
        statusBox.textContent = "Error: Masukkan link video YouTube terlebih dahulu!";
        return;
      }

      btn.disabled = true;
      clipsContainer.innerHTML = "";
      statusBox.className = "status loading";
      statusBox.textContent = "Sedang mengunduh video, membuat transkrip AI & memotong klip 9:16... (proses ±1–2 menit, jangan tutup halaman ini)";

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: url,
            num_clips: parseInt(numClips, 10),
            password: password,
            groq_key: groqEl ? groqEl.value.trim() : "",
            gemini_key: geminiEl ? geminiEl.value.trim() : ""
          })
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.error || "Terjadi kesalahan di server.");
        }

        statusBox.style.display = "none";
        data.clips.forEach((clip) => {
          const card = document.createElement("div");
          card.className = "clip-card";
          card.innerHTML = `
            <h3>${clip.title}</h3>
            <p>${clip.reason || ""}</p>
            <video controls src="${clip.video_url}"></video>
            <a class="dl-btn" href="${clip.video_url}" download="${clip.filename}">Download MP4 (9:16)</a>
          `;
          clipsContainer.appendChild(card);
        });
      } catch (err) {
        statusBox.className = "status error";
        statusBox.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
